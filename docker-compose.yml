version: "3.8"

services:
  # IDP Microservice and its MySQL
  idp-mysql:
    image: mysql/mysql-server:8.0
    env_file:
      - ./idp/.env
    ports:
      - "${FORWARD_DB_PORT:-3307}:3307"
    environment:
      MYSQL_ROOT_PASSWORD: "${IDP_SERVICE_DB_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_TCP_PORT: "3307"
      MYSQL_DATABASE: "idp_db"
      MYSQL_USER: "${IDP_SERVICE_DB_USERNAME}"
      MYSQL_PASSWORD: "${IDP_SERVICE_DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: "${MYSQL_EXTRA_OPTIONS}"
    volumes:
      - "sail-mysql:/var/lib/mysql"
      - "./idp/docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh"
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${IDP_SERVICE_DB_PASSWORD}", "-P", "3307"]
      retries: 3
      timeout: 5s

  sina-idp-service:
    image: devmahmoudi/sina-idp-service
    container_name: idp-service
    env_file:
      - ./idp/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:80"
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      WWWUSER: "${WWWUSER}"
      WWWGROUP: "${WWWGROUP}"
      LARAVEL_SAIL: 1
      XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
      XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
      IGNITION_LOCAL_SITES_PATH: "${PWD}"
      DB_CONNECTION: "mysql"
      DB_HOST: "idp-mysql"
      DB_PORT: "3307"
      DB_DATABASE: "idp_db"
      DB_USERNAME: "${IDP_SERVICE_DB_USERNAME}"
      DB_PASSWORD: "${IDP_SERVICE_DB_PASSWORD}"
    networks:
      - default
    depends_on:
      - idp-mysql


  # AI Microservice and its dependencies
  ai-mysql:
    image: mysql/mysql-server:8.0
    env_file:
      - ./ai/.env
    container_name: ai-mysql
    restart: always
    environment:
      MYSQL_TCP_PORT: "3306"
      MYSQL_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${AI_SERVICE_DB_PASSWORD}
      MYSQL_DATABASE: aidb
      MYSQL_USER: ${AI_SERVICE_DB_USERNAME}
      MYSQL_PASSWORD: ${AI_SERVICE_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ai-mysql-data:/var/lib/mysql
    networks:
      - default

  ai-redis:
    image: redis:7.2
    container_name: ai-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - default

  sina-ai-service:
    image: devmahmoudi/sina-ai-service
    container_name: ai-service
    depends_on:
      - ai-mysql
      - ai-redis
      - sina-idp-service
    env_file:
      - ./ai/.env
    environment:
      MYSQL_HOST: ai-mysql
      MYSQL_USER: ${AI_SERVICE_DB_USERNAME}
      MYSQL_PASSWORD: ${AI_SERVICE_DB_PASSWORD}
      MYSQL_DATABASE: aidb
      MYSQL_PORT: 3306
      REDIS_HOST: ai-redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OAUTH_PUBLIC_KEY: ${PASSPORT_PUBLIC_KEY}
    ports:
      - "8090:80"
    networks:
      - default
    command: >
      /bin/sh -c "wait-for-it.sh ai-mysql:3306 -t 120 -- alembic upgrade head &&
                  uvicorn api.main:app --reload --host=0.0.0.0 --port=80"

  rq-worker-default:
      build:
        context: ./ai
        dockerfile: dockerfile
      container_name: rq-worker-default
      depends_on:
        - ai-redis
      env_file:
        - ./ai/.env
      environment:
        REDIS_HOST: ai-redis
        REDIS_PORT: 6379
      networks:
        - default
      volumes:
        - ./ai:/var/www/html/ai
      command: >
        /bin/sh -c "wait-for-it.sh ai-redis:6379 -- rq worker"
  rq-worker-vectorize:
    build:
      context: ./ai
      dockerfile: dockerfile
    container_name: rq-worker-vectorize
    depends_on:
      - ai-redis
    env_file:
      - ./ai/.env
    environment:
      REDIS_HOST: ai-redis
      REDIS_PORT: 6379
    networks:
      - default
    volumes:
      - ./ai:/var/www/html/ai
    command: >
      /bin/sh -c "wait-for-it.sh ai-redis:6379 -- rq worker vectorize"

  rq-worker-crawl:
    build:
      context: ./ai
      dockerfile: dockerfile
    container_name: rq-worker-crawl
    depends_on:
      - ai-redis
    env_file:
      - ./ai/.env
    environment:
      REDIS_HOST: ai-redis
      REDIS_PORT: 6379
    networks:
      - default
    volumes:
      - ./ai:/var/www/html/ai
    command: >
      /bin/sh -c "wait-for-it.sh ai-redis:6379 -- rq worker crawl"

  knowledge-mysql:
    image: mysql/mysql-server:8.0
    env_file:
      - ./knowledge/.env
    ports:
      - "${FORWARD_DB_PORT:-3308}:3308"
    environment:
      MYSQL_ROOT_PASSWORD: "${KNOWLEDGE_SERVICE_DB_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_TCP_PORT: "3308"
      MYSQL_PORT: "3308"
      MYSQL_DATABASE: "knowledge_db"
      MYSQL_USER: "${KNOWLEDGE_SERVICE_DB_USERNAME}"
      MYSQL_PASSWORD: "${KNOWLEDGE_SERVICE_DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: "${MYSQL_EXTRA_OPTIONS}"
    volumes:
      - knowledge-mysql-data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p ${KNOWLEDGE_SERVICE_DB_PASSWORD}", "-P", "3308"]
      retries: 3
      timeout: 5s

  sina-knowledge-service:
    image: devmahmoudi/sina-knowledge-service
    container_name: knowledge-service
    depends_on:
      - knowledge-mysql
      - sina-idp-service
    env_file:
      - ./knowledge/.env
    environment:
      DB_HOST: knowledge-mysql
      DB_USER: ${KNOWLEDGE_SERVICE_DB_USERNAME}
      DB_PASS: ${KNOWLEDGE_SERVICE_DB_PASSWORD}
      DB_NAME: knowledge_db
      DB_PORT: 3308
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OAUTH_PUBLIC_KEY: ${PASSPORT_PUBLIC_KEY}
    ports:
      - "8050:80"
    networks:
      - default
    volumes:
      - chroma_db:/var/www/html/knowledge/data
    command: /bin/sh -c "wait-for-it.sh knowledge-mysql:3308 -t 120 -- alembic upgrade head && uvicorn src.main:app --host=0.0.0.0 --port=80"

volumes:
  sail-mysql:
    driver: local
  ai-mysql-data:
    driver: local
  knowledge-mysql-data:
    driver: local
  chroma_db:
    driver: local

networks:
  default:
    driver: bridge