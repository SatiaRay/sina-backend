version: "3.8"

services:
  # IDP Microservice and its MySQL
  idp-mysql:
    image: mysql/mysql-server:8.0
    env_file:
      - ./idp/.env
    ports:
      - "${FORWARD_DB_PORT:-3307}:3307"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_TCP_PORT: "3307"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: "${MYSQL_EXTRA_OPTIONS}"
    volumes:
      - "sail-mysql:/var/lib/mysql"
      - "./idp/docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh"
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}", "-P", "3307"]
      retries: 3
      timeout: 5s

  idp:
    build:
      context: ./idp
      dockerfile: docker/8.4/Dockerfile
      args:
        WWWGROUP: "${WWWGROUP}"
    image: sail-8.4/app
    env_file:
      - ./idp/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8000}:80"
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      WWWUSER: "${WWWUSER}"
      WWWGROUP: "${WWWGROUP}"
      LARAVEL_SAIL: 1
      XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
      XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
      IGNITION_LOCAL_SITES_PATH: "${PWD}"
    networks:
      - default
    depends_on:
      - idp-mysql


  # AI Microservice and its dependencies
  ai-mysql:
    image: mysql/mysql-server:8.0
    env_file:
      - ./ai/.env
    container_name: ai-mysql
    restart: always
    environment:
      MYSQL_TCP_PORT: "3306"
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: aidb
      MYSQL_USER: aibot
      MYSQL_PASSWORD: 123456789
    ports:
      - "3306:3306"
    volumes:
      - ai-mysql-data:/var/lib/mysql
    networks:
      - default

  ai-redis:
    image: redis:7.2
    container_name: ai-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - default

  ai:
    build:
      context: ./ai
      dockerfile: dockerfile
    container_name: ai
    depends_on:
      - ai-mysql
      - ai-redis
      - idp
    env_file:
      - ./ai/.env
    environment:
      MYSQL_HOST: ai-mysql
      MYSQL_USER: aibot
      MYSQL_PASSWORD: 123456789
      MYSQL_DATABASE: aidb
      MYSQL_PORT: 3306
      REDIS_HOST: ai-redis
      REDIS_PORT: 6379
    ports:
      - "8090:80"
    networks:
      - default
    command: >
      /bin/sh -c "wait-for-it.sh ai-mysql:3306 -- alembic upgrade head &&
                  uvicorn api.main:app --reload --host=0.0.0.0 --port=80"

  rq-worker-default:
      build:
        context: ./ai
        dockerfile: dockerfile
      container_name: rq-worker-default
      depends_on:
        - ai-redis
      env_file:
        - ./ai/.env
      environment:
        REDIS_HOST: ai-redis
        REDIS_PORT: 6379
      networks:
        - default
      volumes:
        - ./ai:/var/www/html/ai
      command: >
        /bin/sh -c "wait-for-it.sh ai-redis:6379 -- rq worker"
  rq-worker-vectorize:
    build:
      context: ./ai
      dockerfile: dockerfile
    container_name: rq-worker-vectorize
    depends_on:
      - ai-redis
    env_file:
      - ./ai/.env
    environment:
      REDIS_HOST: ai-redis
      REDIS_PORT: 6379
    networks:
      - default
    volumes:
      - ./ai:/var/www/html/ai
    command: >
      /bin/sh -c "wait-for-it.sh ai-redis:6379 -- rq worker vectorize"

  rq-worker-crawl:
    build:
      context: ./ai
      dockerfile: dockerfile
    container_name: rq-worker-crawl
    depends_on:
      - ai-redis
    env_file:
      - ./ai/.env
    environment:
      REDIS_HOST: ai-redis
      REDIS_PORT: 6379
    networks:
      - default
    volumes:
      - ./ai:/var/www/html/ai
    command: >
      /bin/sh -c "wait-for-it.sh ai-redis:6379 -- rq worker crawl"

  knowledge-mysql:
    image: mysql/mysql-server:8.0
    env_file:
      - ./knowledge/.env
    ports:
      - "${FORWARD_DB_PORT:-3308}:3308"
    environment:
      MYSQL_ROOT_PASSWORD: "123456789"
      MYSQL_ROOT_HOST: "%"
      MYSQL_TCP_PORT: "3308"
      MYSQL_DATABASE: "knowledge_db"
      MYSQL_USER: "knowledge_serv"
      MYSQL_PASSWORD: "123456789"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: "${MYSQL_EXTRA_OPTIONS}"
    volumes:
      - knowledge-mysql-data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p 123456789", "-P", "3308"]
      retries: 3
      timeout: 5s

  knowledge:
    build:
      context: ./knowledge
      dockerfile: dockerfile
    container_name: knowledge
    depends_on:
      - knowledge-mysql
      - idp
    env_file:
      - ./knowledge/.env
    ports:
      - "8050:80"
    networks:
      - default
    volumes:
      - ./knowledge/data/chroma:/var/www/html/knowledge/data/chroma
    command: /bin/sh -c "wait-for-it.sh knowledge-mysql:3308 -- alembic upgrade head && uvicorn src.main:app --host=0.0.0.0 --port=80"

volumes:
  sail-mysql:
    driver: local
  ai-mysql-data:
    driver: local
  knowledge-mysql-data:
    driver: local

networks:
  default:
    driver: bridge