version: "3.8"

services:
  chroma:
    image: chromadb/chroma

  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: ai_db
      MYSQL_USER: ai_chatbot
      MYSQL_PASSWORD: 123456789
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis: 
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: khan
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - chroma
      - redis
    command: >
      sh -c "./wait-for-it.sh mysql:3306 --timeout=60 --strict &&
             alembic upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --reload"
    volumes:
      - .:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  rq_crawl:
    build:
      context: .
      dockerfile: dockerfile
    command: python worker.py crawl
    depends_on:
      - redis
    volumes:
      - .:/app
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  rq_vectorize:
    build:
      context: .
      dockerfile: dockerfile
    command: python worker.py vectorize
    depends_on:
      - redis
    volumes:
      - .:/app
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
  rq_default:
    build:
      context: .
      dockerfile: dockerfile
    command: python worker.py default
    depends_on:
      - redis
    volumes:
      - .:/app
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  mysql_data:
    driver: local
