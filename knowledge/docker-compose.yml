version: "3.8"

services:
  knowledge:
    build:
      context: .
      dockerfile: dockerfile
    container_name: knowledge
    ports:
      - "8050:80"
    networks:
      - default
    volumes:
      - chroma_db:/var/www/html/knowledge/data
    command: /bin/sh -c "wait-for-it.sh knowledge-mysql:3308 -- alembic upgrade head && uvicorn src.main:app --host=0.0.0.0 --port=80"

  knowledge-mysql:
    image: mysql/mysql-server:8.0
    env_file:
      - ./.env
    ports:
      - "${FORWARD_DB_PORT:-3308}:3308"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASS}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_TCP_PORT: "3308"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASS}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: "${MYSQL_EXTRA_OPTIONS}"
    volumes:
      - knowledge-mysql-data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASS}", "-P", "3308"]
      retries: 3
      timeout: 5s

volumes:
  chroma_db:
  knowledge-mysql-data:

networks:
  default:
    driver: bridge
