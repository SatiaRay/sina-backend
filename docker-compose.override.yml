version: "3.8"

services:
  init:
    volumes:
      - secrets:/secrets
      - "./idp:/var/www/html"

  sina-knowledge-service:
    build:
      context: ./knowledge
      dockerfile: dockerfile
    volumes:
      - ./knowledge:/var/www/html/knowledge/
      - chroma_db:/var/www/html/knowledge/data

  sina-ai-service:
    build:
      context: ./ai
      dockerfile: dockerfile
    volumes:
      - ./ai:/var/www/html/ai

  sina-idp-service:
    build:
      context: ./idp
      dockerfile: docker/8.4/Dockerfile
      args:
        WWWGROUP: "${WWWGROUP}"
    volumes:
      - "./idp:/var/www/html"
      - "secrets:/secrets"
