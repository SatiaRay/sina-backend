version: "3.8"

services:
  sina-knowledge-service:
    volumes:
      - ./knowledge:/var/www/html/knowledge/
      - chroma_db:/var/www/html/knowledge/data
    command: /bin/sh -c "wait-for-it.sh knowledge-mysql:3308 -- alembic upgrade head && uvicorn src.main:app --reload --host=0.0.0.0 --port=80"

  sina-ai-service:
    volumes:
      - ./ai:/var/www/html/ai

  sina-idp-service:
    volumes:
      - "./idp:/var/www/html"