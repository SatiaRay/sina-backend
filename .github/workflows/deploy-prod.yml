name: 🚀 Deploy Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: 🏭 Deploy Production Server
    runs-on: prod-runner

    steps:
      - name: 📥 Pull or Clone Repository
        run: |
          PROJECT_DIR="/srv/projects/ai-chatbot"

          if [ -d "$PROJECT_DIR/.git" ]; then
            echo "🔄 Project already cloned. Pulling latest changes..."
            cd "$PROJECT_DIR"
            git pull origin master
          else
            echo "📦 Cloning fresh project..."
            git clone -b master git@github.com:satiarepomahmoudi/ai-chatbot.git "$PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi

      - name: 🐳 Docker Compose Up
        run: |
          cd /srv/projects/ai-chatbot
          docker compose down || true
          docker compose up -d

      - name: ✅ Done
        run: echo "✔ Production deployed!"
