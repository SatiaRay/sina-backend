name: 🚀 Deploy with Docker Compose

on:
  push:
    branches:
      - main  # or your default branch
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: 🧱 Build & Run Container
    runs-on: self-hosted  # 👈 Targets your self-hosted runner

    steps:
      - name: 📥 Clone the repository
        run: |
          pwd
          git clone -b master git@github.com:satiarepomahmoudi/ai-chatbot.git

      - name: 🐳 Docker Compose - Build and Run
        run: |
          cd ai-chatbot  # Make sure to `cd` into the cloned repository
          pwd
          echo "🧹 Stopping existing containers..."
          docker-compose down || true

          ls -la

          echo "🚀 Building and starting containers..."
          docker-compose up -d --build

      - name: ✅ Done
        run: echo "✔ Deployment completed!"
