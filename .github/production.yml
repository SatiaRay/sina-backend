# .github/workflows/production.yml
name: Production Workflow

on:
  workflow_dispatch:

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  ENVIRONMENT: production

jobs:
  build-and-push:
    runs-on: production-server
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-docker-${{ hashFiles('**/Dockerfile', '**/dockerfile') }}
          path: /tmp/.buildx-cache
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Set tags for IDP
        id: idp_tags
        run: |
          if [ "${{ needs.release.outputs.new_release_published }}" = "true" ]; then
            echo "tags=${{ env.DOCKER_HUB_USERNAME }}/sina-idp-service:${{ needs.release.outputs.new_release_version }},${{ env.DOCKER_HUB_USERNAME }}/sina-idp-service:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.DOCKER_HUB_USERNAME }}/sina-idp-service:${{ github.sha }},${{ env.DOCKER_HUB_USERNAME }}/sina-idp-service:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push IDP image
        uses: docker/build-push-action@v6
        with:
          context: ./idp
          file: ./idp/docker/8.4/Dockerfile
          push: true
          tags: ${{ steps.idp_tags.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            WWWGROUP=${{ vars.WWWGROUP }}

      - name: Set tags for AI
        id: ai_tags
        run: |
          if [ "${{ needs.release.outputs.new_release_published }}" = "true" ]; then
            echo "tags=${{ env.DOCKER_HUB_USERNAME }}/sina-ai-service:${{ needs.release.outputs.new_release_version }},${{ env.DOCKER_HUB_USERNAME }}/sina-ai-service:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.DOCKER_HUB_USERNAME }}/sina-ai-service:${{ github.sha }},${{ env.DOCKER_HUB_USERNAME }}/sina-ai-service:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push AI image
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          file: ./ai/dockerfile
          push: true
          tags: ${{ steps.ai_tags.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Set tags for Knowledge
        id: knowledge_tags
        run: |
          if [ "${{ needs.release.outputs.new_release_published }}" = "true" ]; then
            echo "tags=${{ env.DOCKER_HUB_USERNAME }}/sina-knowledge-service:${{ needs.release.outputs.new_release_version }},${{ env.DOCKER_HUB_USERNAME }}/sina-knowledge-service:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.DOCKER_HUB_USERNAME }}/sina-knowledge-service:${{ github.sha }},${{ env.DOCKER_HUB_USERNAME }}/sina-knowledge-service:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Knowledge image
        uses: docker/build-push-action@v6
        with:
          context: ./knowledge
          file: ./knowledge/dockerfile
          push: true
          tags: ${{ steps.knowledge_tags.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    runs-on: production-server
    needs: [build-and-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set_tag
        run: |
          if [ "${{ needs.release.outputs.new_release_published }}" = "true" ]; then
            echo "tag=${{ needs.release.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Update docker-compose with production tags
        run: |
          sed -i "s|image: sail-8.4/app|image: ${{ env.DOCKER_HUB_USERNAME }}/sina-idp-service:${{ steps.set_tag.outputs.tag }}|g" docker-compose.yml
          sed -i "s|build:\n *context: ./ai\n *dockerfile: dockerfile|image: ${{ env.DOCKER_HUB_USERNAME }}/sina-ai-service:${{ steps.set_tag.outputs.tag }}|g" docker-compose.yml
          sed -i "s|build:\n *context: ./knowledge\n *dockerfile: dockerfile|image: ${{ env.DOCKER_HUB_USERNAME }}/sina-knowledge-service:${{ steps.set_tag.outputs.tag }}|g" docker-compose.yml

      - name: Deploy to production
        run: |
          docker-compose pull
          docker-compose up -d --force-recreate
          # Add any necessary post-deploy commands or migrations

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -p semantic-release@25 \
              -p @semantic-release/commit-analyzer \
              -p @semantic-release/release-notes-generator \
              -p @semantic-release/changelog \
              -p @semantic-release/github \
              -p @semantic-release/git \
              semantic-release
      - name: Done
        run: |
          echo "GitHub Release and tag created successfully!"
